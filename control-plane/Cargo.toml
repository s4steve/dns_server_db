[package]
name = "control-plane"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
hickory-proto = "0.26"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
