# `docker compose up -d` starts Postgres only (for local development).
# `docker compose --profile multinode up -d --build` adds the control plane and two DNS nodes.
#
# The tokens below are fixed, public, development-only secrets: never reuse them anywhere real.
x-dev-tokens:
  admin: &admin-token dnsdb_dev_admin_token_do_not_use_in_production
  nodes: &nodes-token dnsdb_dev_nodes_token_do_not_use_in_production

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dns
      POSTGRES_PASSWORD: dns # local development only
      POSTGRES_DB: dns
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dns"]
      interval: 2s
      retries: 15

  # One-shot: mints the dev admin token and the nodes' read-only token, if missing.
  bootstrap:
    profiles: [multinode]
    build: .
    entrypoint: ["sh", "-c"]
    command:
      - control-plane create-token --name dev-admin --admin --secret-env ADMIN_TOKEN --if-missing &&
        control-plane create-token --name dev-nodes --grant '*:viewer' --secret-env NODES_TOKEN --if-missing
    environment:
      DATABASE_URL: postgres://dns:dns@postgres:5432/dns
      ADMIN_TOKEN: *admin-token
      NODES_TOKEN: *nodes-token
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    profiles: [multinode]
    build: .
    command: ["control-plane"]
    environment:
      DATABASE_URL: postgres://dns:dns@postgres:5432/dns
      LISTEN: 0.0.0.0:8053
    ports:
      - "127.0.0.1:8054:8053" # 8054 on the host, so it can run beside a local `cargo run` on 8053
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  node1: &node
    profiles: [multinode]
    build: .
    command: ["dns-server", "serve", "/data", "--listen", "0.0.0.0:5300", "--follow", "http://control-plane:8053", "--node-id", "node1",
              "--http", "0.0.0.0:9153"]
    ports:
      - "127.0.0.1:5301:5300/udp"
      - "127.0.0.1:5301:5300/tcp"
      - "127.0.0.1:9301:9153"
    environment:
      CONTROL_PLANE_TOKEN: *nodes-token
      CONTROL_PLANE_ALLOW_HTTP: "1" # plain HTTP on the private compose network only
      COOKIE_SECRET: 000102030405060708090a0b0c0d0e0f # shared, as behind anycast; dev-only
    depends_on: [control-plane]

  node2:
    <<: *node
    command: ["dns-server", "serve", "/data", "--listen", "0.0.0.0:5300", "--follow", "http://control-plane:8053", "--node-id", "node2",
              "--http", "0.0.0.0:9153"]
    ports:
      - "127.0.0.1:5302:5300/udp"
      - "127.0.0.1:5302:5300/tcp"
      - "127.0.0.1:9302:9153"

volumes:
  pgdata:
