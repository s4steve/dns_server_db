# `docker compose up -d` starts Postgres only (for local development).
# `docker compose --profile multinode up -d --build` adds the control plane and two DNS nodes.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dns
      POSTGRES_PASSWORD: dns # local development only
      POSTGRES_DB: dns
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dns"]
      interval: 2s
      retries: 15

  control-plane:
    profiles: [multinode]
    build: .
    command: ["control-plane"]
    environment:
      DATABASE_URL: postgres://dns:dns@postgres:5432/dns
      LISTEN: 0.0.0.0:8053
    ports:
      - "127.0.0.1:8054:8053" # 8054 on the host, so it can run beside a local `cargo run` on 8053
    depends_on:
      postgres:
        condition: service_healthy

  node1: &node
    profiles: [multinode]
    build: .
    command: ["dns-server", "serve", "/data", "--listen", "0.0.0.0:53", "--follow", "http://control-plane:8053", "--node-id", "node1"]
    ports:
      - "127.0.0.1:5301:53/udp"
      - "127.0.0.1:5301:53/tcp"
    depends_on: [control-plane]

  node2:
    <<: *node
    command: ["dns-server", "serve", "/data", "--listen", "0.0.0.0:53", "--follow", "http://control-plane:8053", "--node-id", "node2"]
    ports:
      - "127.0.0.1:5302:53/udp"
      - "127.0.0.1:5302:53/tcp"

volumes:
  pgdata:
